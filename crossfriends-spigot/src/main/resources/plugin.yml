name: CrossFriends-GUI
main: com.crossfriends.spigot.CrossFriendsSpigotPlugin
version: 1.0.0
api-version: '1.21'
author: Claude
description: Interface graphique d'amis pour CrossFriends. Necessite le plugin proxy CrossFriends installe sur BungeeCord.
commands:
  friend:
    description: Ouvre le menu d'amis (relaie vers le plugin proxy CrossFriends). Seul "/friend gui" est gere ici.
    usage: /friend gui
